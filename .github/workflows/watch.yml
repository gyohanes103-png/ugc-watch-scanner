name: UGC Watch

# Runs the watcher here for unlimited free minutes. The data (database, report, settings) stays in the
# private WATCHDOG repo. Webhooks, AI keys and the Roblox cookie are encrypted repository secrets: GitHub never
# shows them, not even in logs, and never gives them to forks. PUBLIC_LOG keeps item and creator names out of
# the log; alerts go to Discord only.

on:
  workflow_dispatch:                 # started by cron-job.org, or the "Run workflow" button
  schedule:
    - cron: "41 * * * *"             # backup only: skipped when cron-job.org started a run in the last 40 minutes

permissions:
  contents: read

concurrency:
  group: ugc-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      FEED_WEBHOOK_URL: ${{ secrets.FEED_WEBHOOK_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
      DATA_REPO: gyohanes103-png/WATCHDOG
      PUBLIC_LOG: "1"
      RUN_MINUTES: "25"
      DEEP_PER_RUN: "400"
    steps:
      - uses: actions/checkout@v4
      - name: Get the watcher's data from the private repo
        uses: actions/checkout@v4
        with:
          repository: gyohanes103-png/WATCHDOG
          token: ${{ secrets.DATA_TOKEN }}
          path: data
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Run the watcher
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "secrets not set up yet, skipping"; exit 0; fi
          python ugc_watch.py --once --data data
      - name: Save memory to the private repo
        if: always()
        working-directory: data
        run: |
          git config user.name "ugc-watch"
          git config user.email "ugc-watch@users.noreply.github.com"
          [ -n "$DISCORD_WEBHOOK_URL" ] || exit 0
          [ -f ugc_watch.db ] || exit 0
          for attempt in 1 2 3 4; do
            git fetch -q origin main
            git reset -q origin/main
            git add ugc_watch.db
            [ -f REPORT.md ] && git add REPORT.md
            [ -f ingested.txt ] && git rm -q --cached --ignore-unmatch $(cat ingested.txt) || true
            git diff --cached --quiet && exit 0
            git commit -q -m "update watch state"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
