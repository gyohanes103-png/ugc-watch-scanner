name: run

on:
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *"

permissions:
  contents: read

concurrency:
  group: run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUBLIC_LOG: "1"
      RUN_MINUTES: "25"
      DEEP_PER_RUN: "5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DATA_REPO }}
          token: ${{ secrets.DATA_TOKEN }}
          path: data
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - env:
          S: ${{ toJSON(secrets) }}
        run: echo "$S" | jq -r 'to_entries[] | select(.key != "github_token") | "\(.key)=\(.value)"' >> "$GITHUB_ENV"
      - run: python main.py --once --data data
      - if: always()
        working-directory: data
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch -q origin main
            git reset -q origin/main
            git add *.db *.md
            [ -f ingested.txt ] && git rm -q --cached --ignore-unmatch $(cat ingested.txt) || true
            git diff --cached --quiet && exit 0
            git commit -q -m "update"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
